# When a new episode goes public on YouTube, put it on the website.
# Every 15 minutes: read the channel's public feed (_build/youtube_sync.py), and if a full video matches a planned
# episode title, record its id, rebuild the pages (_build/build.py), commit and publish. Shorts and other videos are skipped.
name: YouTube to website
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: youtube-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look for new episodes
        run: python3 -I _build/youtube_sync.py
      - name: Rebuild and publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _build/youtube.json; then echo "No new episode"; exit 0; fi
          python3 -I _build/build.py
          git config user.name "YouTube to website"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "New episode on YouTube: website updated automatically"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped, the push will publish"
