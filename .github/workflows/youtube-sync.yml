# When a new video goes public on the David Park PhD channel, put it on the website.
# Every 15 minutes (GitHub often runs it later): read the channel's public feed (_build/youtube_sync.py), sort each new full
# video into The Merit Test, a show or More videos, rebuild the pages (_build/build.py), commit and publish. Shorts are skipped.
name: YouTube to website
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # off the top of the hour, where GitHub drops most scheduled runs
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: youtube-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look for new episodes
        run: python3 -I _build/youtube_sync.py
      - name: Rebuild and publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _build/youtube.json _build/videos.json; then echo "No new video"; exit 0; fi
          python3 -I _build/build.py
          git config user.name "YouTube to website"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "New video on YouTube: website updated automatically"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped, the push will publish"
